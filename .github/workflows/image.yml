name: build rent-session image
on:
  workflow_dispatch:
  push:
    paths: ['bootstrap/**', '.github/workflows/image.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk (image is ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: bootstrap
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/open-video-models-benchmark-2026:latest
            ghcr.io/${{ github.repository_owner }}/open-video-models-benchmark-2026:${{ github.sha }}
